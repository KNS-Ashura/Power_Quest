# HTTP → HTTPS uniquement (pas de proxy ni CORS ici — évite le doublon * + powerquest)
<VirtualHost *:80>
    ServerName api.powerquest.robinmatelot.codes

    ErrorLog ${APACHE_LOG_DIR}/api-error.log
    CustomLog ${APACHE_LOG_DIR}/api-access.log combined

    RewriteEngine On
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
