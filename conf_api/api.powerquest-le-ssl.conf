<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName api.powerquest.robinmatelot.codes

    ErrorLog ${APACHE_LOG_DIR}/api-error.log
    CustomLog ${APACHE_LOG_DIR}/api-access.log combined

    ProxyRequests Off
    ProxyPreserveHost On

    # Optionnel : accès direct à l'API (debug). Le jeu Web utilise powerquest…/v2 (même origine).
    SSLProxyEngine On
    ProxyPass /game/ ws://127.0.0.1:9080/
    ProxyPassReverse /game/ ws://127.0.0.1:9080/

    ProxyPass /healthcheck http://127.0.0.1:7350/healthcheck
    ProxyPassReverse /healthcheck http://127.0.0.1:7350/healthcheck

    ProxyPass /v2 http://127.0.0.1:7350/v2
    ProxyPassReverse /v2 http://127.0.0.1:7350/v2

    ProxyPass /ws ws://127.0.0.1:7350/ws
    ProxyPassReverse /ws ws://127.0.0.1:7350/ws

    ProxyPass / http://127.0.0.1:7350/
    ProxyPassReverse / http://127.0.0.1:7350/

    # PAS de Header Access-Control-* ici (évite le doublon avec Nakama *)

    SSLCertificateFile /etc/letsencrypt/live/api.powerquest.robinmatelot.codes/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/api.powerquest.robinmatelot.codes/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
